services:
  # Backend Express Web Service
  - type: web
    name: mediamorph-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: 10000

  # Frontend React Static Site
  - type: web
    name: mediamorph-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mediamorph-backend
          property: host
        prefix: https://
        suffix: /api

